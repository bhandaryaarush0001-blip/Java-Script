<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="social-media"></section>
        <div class="container py-5 text-white"></div>
            <h3 class="text-warning">social-media</h3>
                <h2>Let's connect together</h2>
                <div class="row mt-4"></div>
                    <div class="col-md-3 col-sm-6 mb-3"></div>
                        <div class="media_link d-flex justify-content-between text-align-items-centre"></div>
                            <span>Instagram</span>
                            <i class="fa fa Instagram"></i>


                            <!--Facebook-->
                            <div class="col-md-3 col-sm-6 mb-3"></div>
                                <div class="media_link d-flex justify-content-between text-align-items-centre"></div>
                                    <span>Facebook</span>
                                    <i class="fa fa Facebook"></i>
                                    
                                    
                                    <!--Youtube-->
                                    <div class="col-md-3 col-sm-6 mb-3"></div>
                                        <div class="media_link d-flex justify-content-between text-align-items-centre"></div>
                                            <span>Youtube</span>
                                            <i class="fa fa Youtube"></i>
                                            

                                            <!--Twitter-->
                                            <div class="col-md-3 col-sm-6 mb-3"></div>
                                                <div class="media_link d-flex justify-content-between text-align-items-centre"></div>
                                                    <span>Twitter</span>
                                                    <i class="fa fa Twitter"></i>
                                                    

                       
</body>

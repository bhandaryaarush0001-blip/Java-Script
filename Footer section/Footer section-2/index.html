<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Let World Know You</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />

    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- ================= SOCIAL MEDIA ================= -->

    <section id="social-media">
        <div class="container py-5 text-white">
            <h3 class="text-warning">Social Media</h3>
            <h2>Let's be friends</h2>

            <div class="row mt-4">

                <!-- LinkedIn -->
                <div class="col-md-3 col-sm-6 mb-3">
                    <div class="media_link d-flex justify-content-between align-items-center">
                        <span>LinkedIn</span>
                        <i class="fa fa-linkedin"></i>
                    </div>
                </div>

                <!-- GitHub -->
                <div class="col-md-3 col-sm-6 mb-3">
                    <div class="media_link d-flex justify-content-between align-items-center">
                        <span>GitHub</span>
                        <i class="fa fa-github"></i>
                    </div>
                </div>

                <!-- YouTube -->
                <div class="col-md-3 col-sm-6 mb-3">
                    <div class="media_link d-flex justify-content-between align-items-center">
                        <span>YouTube</span>
                        <i class="fa fa-youtube"></i>
                    </div>
                </div>

                <!-- Email -->
                <div class="col-md-3 col-sm-6 mb-3">
                    <div class="media_link d-flex justify-content-between align-items-center">
                        <span>Email</span>
                        <i class="fa fa-envelope"></i>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>

    <!-- ================= FOOTER ================= -->

    <footer>
        <div class="container text-center text-white py-3">
            Copyright © 2021
            <span class="text-warning">All Rights Are Reserved</span>
            by Codingal Education
        </div>
    </footer>

</body>

</html>
